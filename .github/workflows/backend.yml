name: Backend validation and development deployment
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform_test -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform_test:ci_only_password@localhost:5432/platform_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://platform_test:ci_only_password@localhost:5432/platform_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app migrations scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.manage migrate
      - run: python -m scripts.manage seed
      - run: python -m scripts.manage check

  deploy-development:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: backend-development-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_DEV_MIGRATION_DATABASE_URL }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$MIGRATION_DATABASE_URL"
      - run: python -m pip install -r backend/requirements.txt
      - name: Migrate development database before deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DEV_MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_DEV_MIGRATION_DATABASE_URL }}
        run: python -m scripts.manage migrate
      - run: npm install --global vercel@64.2.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy development project and verify health
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          curl --fail --silent --show-error --retry 3 "$deployment_url/health" > /tmp/backend-health.json
          python -c 'import json; d=json.load(open("/tmp/backend-health.json")); assert d == {"status":"ok", "database":"connected"}; print("Deployment health passed")'
