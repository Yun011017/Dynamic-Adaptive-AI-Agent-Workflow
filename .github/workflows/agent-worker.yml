name: Process queued Agent work

on:
  schedule:
    # GitHub-hosted scheduled workflows run no more frequently than every 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  process-one-run:
    # Scheduled execution is opt-in. workflow_dispatch remains available for testing.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AGENT_WORKER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DB_POOL_MODE: queue
      DB_CONNECT_TIMEOUT: "10"
      AGENT_PROVIDER: gemini
      AGENT_MODEL: gemini-3.5-flash-lite
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_FORMS_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_FORMS_APPS_SCRIPT_URL }}
      GOOGLE_FORMS_SOURCE_ID: ${{ vars.GOOGLE_FORMS_SOURCE_ID || 'connection-test' }}
      PLATFORM_WORKSPACE_SLUG: ${{ vars.PLATFORM_WORKSPACE_SLUG || 'development' }}
      GOOGLE_FORMS_MEMBER_COLUMN: ${{ vars.GOOGLE_FORMS_MEMBER_COLUMN || '是否是社員' }}
      GOOGLE_FORMS_ATTENDANCE_COLUMN: ${{ vars.GOOGLE_FORMS_ATTENDANCE_COLUMN || '是否要參加' }}
      GOOGLE_FORMS_SCHOOL_COLUMN: ${{ vars.GOOGLE_FORMS_SCHOOL_COLUMN || '學校' }}
      GOOGLE_FORMS_DEPARTMENT_GRADE_COLUMN: ${{ vars.GOOGLE_FORMS_DEPARTMENT_GRADE_COLUMN || '系級' }}
      GOOGLE_FORMS_ACTIVITY_COLUMN: ${{ vars.GOOGLE_FORMS_ACTIVITY_COLUMN || '參加的活動' }}
      GOOGLE_FORMS_SUBMITTED_AT_COLUMN: ${{ vars.GOOGLE_FORMS_SUBMITTED_AT_COLUMN || '時間戳記' }}
      AGENT_WORKER_POLL_SECONDS: "2"
      AGENT_RUN_LEASE_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Verify worker secrets
        run: |
          test -n "$DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }
          test -n "$GOOGLE_API_KEY" || { echo "Missing GOOGLE_API_KEY secret"; exit 1; }
      - name: Process one queued run
        run: python -m app.agent_worker --once
